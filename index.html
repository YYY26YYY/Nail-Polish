<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
:root,[data-theme=light]{--bg:#fdf8f6;--bg2:#f8eeea;--card:#ffffff;--text:#2a1f23;--muted:#86757b;--line:rgba(42,31,35,.09);--acc:var(--accent);--acc2:var(--accent2);--grad:linear-gradient(135deg,var(--accent),var(--accent2));--on-acc:#fff;--shadow:0 24px 60px -24px rgba(120,60,75,.28);--glass:rgba(255,255,255,.72);--hero-tint:transparent}
[data-theme=dark]{--bg:#121014;--bg2:#19151b;--card:#201b23;--text:#f5eef1;--muted:#ab9ba3;--line:rgba(255,255,255,.09);--shadow:0 24px 60px -24px rgba(0,0,0,.7);--glass:rgba(24,20,27,.72);--on-acc:#fff}
[data-theme=lux]{--bg:#0a0908;--bg2:#100e0b;--card:#15120e;--text:#f4ecdc;--muted:#b4a68b;--line:rgba(212,175,95,.18);--acc:#d4af5f;--acc2:#f1d58f;--grad:linear-gradient(120deg,#a87a2f,#f3d993 45%,#c99a45 70%,#f1d58f);--on-acc:#17120a;--shadow:0 30px 70px -26px rgba(0,0,0,.9);--glass:rgba(12,11,9,.78)}
body{font-family:var(--font),system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;font-size:17px;overflow-x:hidden;transition:background-color .6s,color .6s;-webkit-font-smoothing:antialiased}
[data-theme=lux] body{background:radial-gradient(1200px 600px at 85% -10%,rgba(212,175,95,.10),transparent 60%),radial-gradient(900px 500px at 0% 60%,rgba(212,175,95,.06),transparent 60%),var(--bg)}
img{max-width:100%;display:block}a{color:inherit;text-decoration:none}button{font-family:inherit}
::selection{background:var(--acc);color:var(--on-acc)}
.wrap{width:min(1200px,92%);margin-inline:auto}
h1,h2,h3,h4{font-family:var(--font-h),var(--font),serif;line-height:1.15;font-weight:var(--hw,700);letter-spacing:-.01em}
.grad-txt{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-style:normal}
.ml{white-space:pre-line}
.kicker{display:inline-flex;align-items:center;gap:12px;font-size:.84rem;letter-spacing:.2em;color:var(--acc);font-weight:600}
.kicker::before,.kicker::after{content:'';width:26px;height:1.5px;background:var(--grad)}
.sec{padding:clamp(80px,10vw,140px) 0;position:relative}
.bg-alt{background:var(--bg2)}
.bg-accent{background:var(--grad);color:var(--on-acc)}
.bg-accent .kicker,.bg-accent .sec-head p,.bg-accent .price{color:var(--on-acc)}
.bg-accent .kicker::before,.bg-accent .kicker::after{background:currentColor}
.sec-head{text-align:center;max-width:760px;margin:0 auto clamp(44px,6vw,72px)}
.sec-head h2{font-size:clamp(2.1rem,4.6vw,3.4rem);margin:16px 0 18px}
.sec-head p{color:var(--muted);font-size:1.1rem}
.btn{white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:16px 32px;border-radius:999px;font-weight:600;font-size:1rem;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s,background .35s;cursor:pointer;border:0;font-family:inherit;position:relative;overflow:hidden;isolation:isolate}
.btn svg{width:18px;height:18px;transition:transform .35s}
.btn:hover svg{transform:translateX(-4px)}
.btn.pri{background:var(--grad);background-size:160% 160%;color:var(--on-acc);box-shadow:0 14px 34px -14px var(--acc)}
.btn.pri::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);transform:translateX(120%);transition:transform .8s;z-index:-1}
.btn.pri:hover::after{transform:translateX(-120%)}
.btn.pri:hover{transform:translateY(-3px);box-shadow:0 20px 44px -14px var(--acc)}
.btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{transform:translateY(-3px);border-color:var(--acc)}
.btn.sm{padding:11px 22px;font-size:.93rem}
.btn.full{width:100%}
/* header */
.hdr{position:fixed;inset:0 0 auto;z-index:100;transition:background .4s,box-shadow .4s,backdrop-filter .4s}
.hdr .bar{display:flex;align-items:center;justify-content:space-between;gap:20px;height:88px;transition:height .4s}
.hdr.scrolled{background:var(--glass);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);box-shadow:0 1px 0 var(--line)}
.hdr.scrolled .bar{height:70px}
.logo{display:flex;align-items:center;gap:12px;flex:none}
.logo .iw img{height:var(--logo-h,46px);width:auto;max-width:200px;object-fit:contain}
.logo-t{display:flex;flex-direction:column;line-height:1.1}
.logo-t .ln{font-family:var(--font-h),var(--font);font-size:1.55rem;font-weight:var(--hw,700);letter-spacing:.02em}
.logo-t small{font-size:.74rem;color:var(--muted);letter-spacing:.08em;margin-top:3px}
.nav{display:flex;gap:4px}
.nav a{padding:8px 13px;border-radius:999px;font-size:.96rem;color:var(--muted);transition:.3s;position:relative;white-space:nowrap}
.nav a:hover,.nav a.on{color:var(--text)}
.nav a.on::after{content:'';position:absolute;bottom:2px;right:50%;transform:translateX(50%);width:5px;height:5px;border-radius:50%;background:var(--grad)}
.hdr-end{display:flex;align-items:center;gap:12px}
.themes{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px}
.theme-btn{width:34px;height:34px;border-radius:50%;border:0;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center;transition:.35s}
.theme-btn svg{width:16px;height:16px}
.theme-btn:hover{color:var(--text)}
.theme-btn.on{background:var(--grad);color:var(--on-acc);box-shadow:0 6px 16px -6px var(--acc)}
.burger{display:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--text);place-items:center;cursor:pointer}
.burger svg{width:20px;height:20px}
.nav-x{display:none}
/* hero */
.sec-hero{padding:0;min-height:100vh;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.hero-bg{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(90px);animation:drift 16s ease-in-out infinite}
.b1{width:560px;height:560px;background:var(--acc);top:-160px;left:-160px;opacity:.22}
.b2{width:480px;height:480px;background:var(--acc2);bottom:-140px;right:-120px;opacity:.28;animation-delay:-6s}
.b3{width:300px;height:300px;background:var(--acc);top:40%;left:40%;opacity:.12;animation-delay:-10s}
[data-theme=lux] .blob{opacity:.10}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(40px,6vw,90px);align-items:center;position:relative;z-index:2;padding:150px 0 80px}
.badge{display:inline-flex;align-items:center;gap:10px;padding:9px 20px 9px 16px;border-radius:999px;background:var(--glass);backdrop-filter:blur(10px);border:1px solid var(--line);font-size:.92rem;box-shadow:var(--shadow)}
.badge>i{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 0 var(--acc);animation:pulse 2.2s infinite;flex:none}
.hero h1,.sec-hero h1{font-size:clamp(2.7rem,6.3vw,5.4rem);margin:28px 0 24px;line-height:1.05}
.sec-hero h1 em{display:block;padding-bottom:.08em}
.lead{font-size:clamp(1.05rem,1.6vw,1.26rem);color:var(--muted);max-width:560px}
.btns{display:flex;flex-wrap:wrap;gap:14px;margin-top:38px}
.stats{display:flex;flex-wrap:wrap;gap:clamp(24px,4vw,48px);margin-top:52px;padding-top:32px;border-top:1px solid var(--line)}
.stat b{display:block;font-family:var(--font-h),var(--font);font-size:2.1rem;line-height:1;margin-bottom:6px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{font-size:.9rem;color:var(--muted)}
.hero-media{position:relative;max-width:520px;justify-self:center;width:100%}
.frame{border-radius:320px 320px 28px 28px;overflow:hidden;aspect-ratio:4/5;box-shadow:var(--shadow);position:relative;background:var(--bg2)}
.frame .iw,.frame img{width:100%;height:100%;object-fit:cover}
.frame img{animation:kb 22s ease-in-out infinite alternate}
.ring{position:absolute;inset:0;border:1.5px solid var(--acc);border-radius:320px 320px 28px 28px;opacity:.45;transform:translate(-22px,22px);z-index:-1}
.float-card{position:absolute;display:flex;align-items:center;gap:12px;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:20px;padding:14px 18px;box-shadow:var(--shadow);animation:bob 7s ease-in-out infinite;z-index:3}
.float-card b{display:block;font-size:.98rem;line-height:1.3}.float-card small{display:block;color:var(--muted);font-size:.82rem}
.fc-ic{width:42px;height:42px;border-radius:14px;background:var(--grad);color:var(--on-acc);display:grid;place-items:center;flex:none}
.fc-ic svg{width:20px;height:20px}
.fc1{bottom:9%;right:-38px}
.fc2{top:11%;left:-34px;flex-direction:column;align-items:flex-start;gap:2px;animation-delay:-3.5s}
.stars{color:#f2b23a;letter-spacing:2px;font-size:.95rem}
[data-theme=lux] .stars{color:var(--acc)}
.marquee{position:relative;z-index:2;border-block:1px solid var(--line);padding:24px 0;overflow:hidden;background:var(--bg2);direction:rtl}
.mq-track{display:flex;width:max-content;animation:mq 46s linear infinite}
.mq-g{display:flex}
.mq-g span{font-family:var(--font-h),var(--font);font-size:clamp(1.15rem,2vw,1.55rem);white-space:nowrap;display:flex;align-items:center;gap:44px;padding-left:44px;color:var(--muted)}
.mq-g span::after{content:'✦';color:var(--acc);font-size:.8em}
/* about / text */
.split{display:grid;grid-template-columns:.92fr 1.08fr;gap:clamp(44px,7vw,100px);align-items:center}
.split.img-left .split-media{order:2}
.split-media{position:relative}
.split-media .iw img,.split-media .iw{width:100%;border-radius:calc(var(--r)*1.4);aspect-ratio:4/4.5;object-fit:cover}
.split-media::before{content:'';position:absolute;inset:34px -34px -34px 34px;border-radius:calc(var(--r)*1.4);background:var(--grad);opacity:.16;z-index:-1}
.exp{position:absolute;bottom:-28px;left:-28px;width:140px;height:140px;border-radius:50%;background:var(--grad);color:var(--on-acc);display:grid;place-content:center;text-align:center;box-shadow:var(--shadow);animation:bob 8s ease-in-out infinite;border:6px solid var(--bg)}
.exp b{font-family:var(--font-h),var(--font);font-size:2.3rem;line-height:1}.exp small{font-size:.8rem;line-height:1.25;display:block;padding:0 14px}
.split-txt h2{font-size:clamp(2rem,4.2vw,3.1rem);margin:16px 0 22px}
.split-txt>p{color:var(--muted);font-size:1.08rem}
.feats{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:34px 0 0}
.feat{display:flex;gap:14px;align-items:flex-start;padding:18px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);transition:transform .4s,box-shadow .4s}
.feat:hover{transform:translateY(-5px);box-shadow:var(--shadow)}
.feat .ic{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--acc) 15%,transparent);font-size:1.25rem}
.feat b{display:block;font-size:1rem;margin-bottom:2px}.feat small{display:block;color:var(--muted);font-size:.88rem;line-height:1.5}
.split-txt .btn{margin-top:34px}
/* services */
.tabs,.filters{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-bottom:46px}
.tab,.flt{padding:12px 26px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;font:inherit;font-size:.97rem;color:var(--text);transition:.35s}
.tab:hover,.flt:hover{border-color:var(--acc)}
.tab.on,.flt.on{background:var(--grad);color:var(--on-acc);border-color:transparent;box-shadow:0 12px 28px -12px var(--acc)}
.svc-panel{display:none;grid-template-columns:repeat(2,1fr);gap:20px}
.svc-panel.on{display:grid;animation:fadeUp .7s cubic-bezier(.2,.8,.2,1)}
.svc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:28px 30px;position:relative;overflow:hidden;transition:transform .4s,box-shadow .4s,border-color .4s}
.svc::before{content:'';position:absolute;inset:0 0 0 auto;width:3px;background:var(--grad);transform:scaleY(0);transition:transform .45s;transform-origin:top}
.svc:hover{transform:translateY(-5px);box-shadow:var(--shadow)}.svc:hover::before{transform:none}
.svc-top{display:flex;align-items:baseline;gap:14px}
.svc-top h3{font-size:1.24rem}
.dots{flex:1;border-bottom:2px dotted var(--line);transform:translateY(-6px);min-width:20px}
.price{font-family:var(--font-h),var(--font);font-size:1.4rem;font-weight:var(--hw,700);color:var(--acc);white-space:nowrap}
.svc>p{color:var(--muted);font-size:.96rem;margin-top:8px}
.svc-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;padding:5px 13px;border-radius:999px;background:var(--bg2);color:var(--muted);border:1px solid var(--line)}
.chip svg{width:13px;height:13px}
.chip.hot{background:var(--grad);color:var(--on-acc);border-color:transparent}
.svc-note{text-align:center;color:var(--muted);margin-top:34px;font-size:.95rem}
/* gallery */
.masonry{columns:3 280px;column-gap:20px}
.gi{break-inside:avoid;margin:0 0 20px;border-radius:var(--r);overflow:hidden;position:relative;cursor:zoom-in;background:var(--bg2);box-shadow:0 10px 30px -18px rgba(0,0,0,.3)}
.gi img{width:100%;transition:transform 1s cubic-bezier(.2,.8,.2,1)}
.gi:hover img{transform:scale(1.07)}
.gi figcaption{position:absolute;inset:auto 0 0;padding:48px 22px 18px;background:linear-gradient(transparent,rgba(20,10,14,.66));color:#fff;opacity:0;transform:translateY(12px);transition:.45s;font-weight:500}
.gi:hover figcaption{opacity:1;transform:none}
.gi.hide{display:none}
.gi::after{content:'';position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);pointer-events:none}
/* process */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:26px;position:relative}
.step{text-align:center;padding:10px 8px;position:relative}
.step .num{width:82px;height:82px;margin:0 auto 24px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-h),var(--font);font-size:1.7rem;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);position:relative;color:var(--acc)}
.step .num::after{content:'';position:absolute;inset:-8px;border-radius:50%;border:1.5px dashed var(--acc);opacity:.45;animation:spin 22s linear infinite}
.step h3{font-size:1.22rem;margin-bottom:8px}.step p{color:var(--muted);font-size:.95rem}
/* reviews */
.reviews{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:22px}
.rev{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:34px 32px 30px;position:relative;transition:transform .4s,box-shadow .4s}
.rev:hover{transform:translateY(-5px);box-shadow:var(--shadow)}
.rev::before{content:'\201D';position:absolute;top:8px;left:26px;font-size:5.5rem;font-family:Georgia,serif;line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;opacity:.4}
.rev>p{margin:14px 0 24px;font-size:1.02rem}
.who{display:flex;align-items:center;gap:12px}
.av{width:46px;height:46px;border-radius:50%;background:var(--grad);color:var(--on-acc);display:grid;place-items:center;font-weight:700;font-size:1.1rem;flex:none}
.who b{display:block;font-size:.98rem}.who small{display:block;color:var(--muted);font-size:.84rem}
/* faq */
.faq{max-width:840px;margin:auto;display:grid;gap:14px}
.faq details{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:0 28px;transition:box-shadow .35s,border-color .35s}
.faq details[open]{box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--acc) 35%,transparent)}
.faq summary{list-style:none;cursor:pointer;padding:23px 0;font-weight:600;font-size:1.08rem;display:flex;justify-content:space-between;gap:16px;align-items:center}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:'+';font-size:1.7rem;font-weight:300;color:var(--acc);transition:transform .35s;flex:none;line-height:1}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details>p{padding-bottom:24px;color:var(--muted)}
/* cta */
.cta-box{border-radius:calc(var(--r)*1.7);padding:clamp(54px,8vw,100px) clamp(24px,6vw,80px);text-align:center;background:var(--grad);color:var(--on-acc);position:relative;overflow:hidden;isolation:isolate}
.cta-box::before,.cta-box::after{content:'';position:absolute;border-radius:50%;background:rgba(255,255,255,.14);z-index:-1}
.cta-box::before{width:420px;height:420px;top:-200px;right:-120px}
.cta-box::after{width:300px;height:300px;bottom:-160px;left:-80px;animation:drift 14s ease-in-out infinite}
.cta-box h2{font-size:clamp(2rem,4.6vw,3.4rem);max-width:760px;margin:0 auto 16px}
.cta-box p{max-width:600px;margin:auto;opacity:.92;font-size:1.1rem}
.cta-box .btn{background:var(--bg);color:var(--text);margin-top:34px;box-shadow:0 18px 40px -18px rgba(0,0,0,.45)}
.cta-box .btn:hover{transform:translateY(-3px)}
/* contact */
.contact-grid{display:grid;grid-template-columns:1fr 1.2fr;gap:clamp(28px,4vw,48px);align-items:start}
.info{display:grid;gap:14px}
.ic-card{display:flex;gap:16px;align-items:center;padding:20px 22px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);transition:transform .35s,box-shadow .35s,border-color .35s}
a.ic-card:hover{transform:translateX(-5px);box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--acc) 40%,transparent)}
.ic-card .ic,.hours .ic{width:50px;height:50px;border-radius:16px;background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc);display:grid;place-items:center;flex:none}
.ic-card .ic svg,.hours .ic svg{width:22px;height:22px}
.ic-card small{display:block;color:var(--muted);font-size:.84rem}.ic-card b{display:block;font-size:1.05rem;font-weight:600;direction:ltr;text-align:right;unicode-bidi:plaintext}
.hours{padding:22px;background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.hours-h{display:flex;align-items:center;gap:16px;margin-bottom:12px}
.hours-h b{font-size:1.05rem}
.hrow{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px dashed var(--line);font-size:.96rem}
.hrow span:last-child{color:var(--muted);direction:ltr;unicode-bidi:plaintext}
.socials{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.socials a{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);transition:.35s;color:var(--text)}
.socials a:hover{background:var(--grad);color:var(--on-acc);transform:translateY(-4px) rotate(-6deg);border-color:transparent}
.socials svg{width:20px;height:20px}
.navbtns{display:flex;gap:10px;flex-wrap:wrap}
.form-card{background:var(--card);border:1px solid var(--line);border-radius:calc(var(--r)*1.4);padding:clamp(28px,4vw,46px);box-shadow:var(--shadow);position:relative;overflow:hidden}
.form-card::before{content:'';position:absolute;top:0;right:0;left:0;height:4px;background:var(--grad)}
.form-card h3{font-size:1.7rem;margin-bottom:6px}
.f-note{color:var(--muted);margin-bottom:24px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:22px}
.fld{display:flex;flex-direction:column;gap:7px}.fld.full{grid-column:1/-1}
.fld label{font-size:.88rem;font-weight:600}
.fld input,.fld select,.fld textarea{font:inherit;font-size:1rem;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--text);transition:border-color .25s,box-shadow .25s;width:100%;outline:0}
.fld textarea{resize:vertical;min-height:110px}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 16%,transparent)}
.fld.err input{border-color:#d9475f}
.form-res{margin-top:18px;padding:18px 20px;border-radius:16px;background:color-mix(in srgb,var(--acc) 10%,var(--card));border:1px solid color-mix(in srgb,var(--acc) 30%,transparent);animation:fadeUp .5s}
.form-res b{display:block;font-size:1.08rem;margin-bottom:4px}.form-res p{color:var(--muted);font-size:.94rem;margin-bottom:12px}
.form-res .btns{margin-top:6px}
/* footer */
.ftr{background:var(--bg2);padding:84px 0 30px;border-top:1px solid var(--line)}
.ftr-grid{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:44px}
.ftr .logo{margin-bottom:18px}
.ftr-txt{color:var(--muted);max-width:380px;margin-bottom:18px}
.ftr h4{font-size:1.08rem;margin-bottom:18px}
.ftr-links a,.ftr-links span{display:block;color:var(--muted);padding:5px 0;transition:.3s}
.ftr-links a:hover{color:var(--acc);transform:translateX(-4px)}
.copy{margin-top:64px;padding-top:26px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:.9rem}
/* floats */
.wa-float{position:fixed;bottom:26px;left:26px;width:62px;height:62px;border-radius:50%;background:#25d366;color:#fff;display:grid;place-items:center;box-shadow:0 14px 34px -10px rgba(37,211,102,.7);z-index:90;transition:transform .35s}
.wa-float:hover{transform:scale(1.08) rotate(-8deg)}
.wa-float svg{width:30px;height:30px}
.wa-float::before{content:'';position:absolute;inset:0;border-radius:50%;border:2px solid #25d366;animation:ripple 2.4s infinite}
.totop{position:fixed;bottom:26px;right:26px;width:50px;height:50px;border-radius:50%;background:var(--card);border:1px solid var(--line);color:var(--text);display:grid;place-items:center;z-index:90;box-shadow:var(--shadow);opacity:0;transform:translateY(20px);pointer-events:none;transition:.4s;cursor:pointer}
.totop.show{opacity:1;transform:none;pointer-events:auto}
.totop svg{width:20px;height:20px}
/* lightbox */
.lb{position:fixed;inset:0;z-index:200;background:rgba(12,8,10,.92);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;padding:4vh 4vw}
.lb.on{display:flex;animation:fi .35s}
.lb img{max-width:100%;max-height:80vh;border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.5);animation:zi .45s cubic-bezier(.2,.8,.2,1)}
.lb p{color:#fff;opacity:.85}
.lb button{position:absolute;width:52px;height:52px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;cursor:pointer;display:grid;place-items:center;transition:.3s}
.lb button:hover{background:rgba(255,255,255,.2)}
.lb button svg{width:22px;height:22px}
.lb-x{top:24px;left:24px}.lb-p{right:24px;top:50%}.lb-n{left:24px;top:50%}
/* reveal */
.rv{opacity:0;transform:translateY(36px);transition:opacity 1s cubic-bezier(.2,.8,.2,1),transform 1s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}
.no-anim .rv{opacity:1;transform:none;transition:none}
.no-anim .blob,.no-anim .float-card,.no-anim .frame img,.no-anim .exp{animation:none}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(40px,-30px) scale(1.08)}66%{transform:translate(-30px,25px) scale(.95)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--acc) 60%,transparent)}70%{box-shadow:0 0 0 10px transparent}100%{box-shadow:0 0 0 0 transparent}}
@keyframes ripple{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.6);opacity:0}}
@keyframes mq{to{transform:translateX(50%)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.08)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}}
@keyframes fi{from{opacity:0}}
@keyframes zi{from{opacity:0;transform:scale(.94)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
@media(max-width:1180px){
 .nav{position:fixed;top:0;right:0;height:100vh;height:100dvh;width:min(340px,86%);flex-direction:column;gap:6px;background:var(--bg);padding:96px 26px 30px;transform:translateX(105%);transition:transform .5s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow);z-index:120;border-left:1px solid var(--line)}
 .nav.open{transform:none}
 .nav a{font-size:1.2rem;padding:12px 16px;border-radius:14px}
 .nav a.on{background:var(--bg2)}.nav a.on::after{display:none}
 .nav-x{display:grid;position:absolute;top:24px;left:22px}
 .burger{display:grid}
 .hdr-cta{display:none}
 .menu-open::after{content:'';position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:110}
}
@media(max-width:900px){
 .hero-grid{grid-template-columns:1fr;padding:120px 0 60px;text-align:center}
 .hero-txt{display:flex;flex-direction:column;align-items:center}
 .lead{margin-inline:auto}.btns,.stats{justify-content:center}
 .hero-media{max-width:400px;margin-top:20px}
 .fc1{right:-12px}.fc2{left:-12px}
 .split,.contact-grid{grid-template-columns:1fr}
 .split.img-left .split-media{order:0}
 .split-media{max-width:520px;margin-inline:auto;width:100%}
 .svc-panel{grid-template-columns:1fr}
 .ftr-grid{grid-template-columns:1fr 1fr}.ftr-grid>div:first-child{grid-column:1/-1}
}
@media(max-width:560px){
 body{font-size:16px}
 .hdr .bar{height:74px}.themes{padding:3px}.theme-btn{width:30px;height:30px}
 .logo-t small{display:none}.logo-t .ln{font-size:1.3rem}
 .feats,.fgrid{grid-template-columns:1fr}
 .ftr-grid{grid-template-columns:1fr}
 .exp{width:112px;height:112px;left:-8px;bottom:-20px}.exp b{font-size:1.8rem}
 .svc{padding:22px}.svc-top{flex-wrap:wrap}.dots{display:none}.price{margin-right:auto}
 .faq details{padding:0 20px}
 .float-card{padding:10px 14px}.fc-ic{width:36px;height:36px}
 .wa-float{width:56px;height:56px;bottom:18px;left:18px}.totop{bottom:18px;right:18px}
 .masonry{columns:2 140px;column-gap:12px}.gi{margin-bottom:12px}
}
</style>

    sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
    moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
    crown:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 8l4 4 5-7 5 7 4-4-2 11H5z"/></svg>',
    menu:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M10 17h10"/></svg>',
    x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    arrow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>',
    next:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg>',
    prev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>',
    up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>',
    spark:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z" opacity=".7"/></svg>',
    phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>',
    wa:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4c-.3-.1-1.8-.9-2-1-.3-.1-.5-.1-.7.1-.2.3-.8 1-.9 1.2-.2.2-.3.2-.6.1-.3-.1-1.3-.5-2.4-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6l.4-.5c.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5l-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.1.2 2.1 3.2 5.1 4.5.7.3 1.3.5 1.7.6.7.2 1.4.2 1.9.1.6-.1 1.8-.7 2-1.4.2-.7.2-1.3.2-1.4-.1-.1-.3-.2-.6-.4zM12 21.8c-1.8 0-3.5-.5-5-1.4l-.4-.2-3.7 1 1-3.6-.2-.4A9.8 9.8 0 0 1 12 2.2c2.6 0 5.1 1 7 2.9a9.7 9.7 0 0 1 2.9 7c0 5.4-4.4 9.7-9.9 9.7zm8.4-18.1A11.8 11.8 0 0 0 12 .2C5.5.2.2 5.5.2 12c0 2.1.5 4.1 1.6 5.9L.1 24l6.3-1.6c1.7.9 3.7 1.4 5.6 1.4 6.5 0 11.8-5.3 11.8-11.8 0-3.2-1.2-6.1-3.4-8.3z"/></svg>',
    mail:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="M22 7l-10 6L2 7"/></svg>',
    pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg>',
    clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>',
    ig:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="2" width="20" height="20" rx="6"/><circle cx="12" cy="12" r="4.5"/><circle cx="17.6" cy="6.4" r="1.2" fill="currentColor" stroke="none"/></svg>',
    fb:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 8.5V6.8c0-.8.2-1.3 1.4-1.3H17V2.2C16.7 2.1 15.6 2 14.4 2 11.8 2 10 3.6 10 6.5v2H7.3v3.7H10V22h4v-9.8h2.8l.4-3.7z"/></svg>',
    tt:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.6 5.8A4.3 4.3 0 0 1 15.5 3h-3.2v12.4a2.6 2.6 0 0 1-2.6 2.5 2.6 2.6 0 0 1-2.6-2.6 2.6 2.6 0 0 1 3.4-2.5V9.6a5.8 5.8 0 0 0-6.6 5.7 5.8 5.8 0 0 0 5.8 5.8 5.8 5.8 0 0 0 5.8-5.8V9a7.4 7.4 0 0 0 4.3 1.4V7.2a4.3 4.3 0 0 1-3.2-1.4z"/></svg>',
    waze:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 16.5C3 15.3 2 13.4 2 11.3 2 6.7 6.5 3 12 3s10 3.7 10 8.3c0 4.6-4.5 8.3-10 8.3-.9 0-1.8-.1-2.6-.3"/><circle cx="7.5" cy="19.5" r="1.8"/><circle cx="15.5" cy="19.5" r="1.8"/><circle cx="9" cy="10" r=".6" fill="currentColor"/><circle cx="15" cy="10" r=".6" fill="currentColor"/><path d="M9 13.5c1.6 1.4 4.4 1.4 6 0"/></svg>',
    map:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 6v16l7-4 8 4 7-4V2l-7 4-8-4z"/><path d="M8 2v16M16 6v16"/></svg>',
    send:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg>',
    img:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>',
    check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>'
  };

  /* ---------- helpers for markup ---------- */
  const T = (tag, path, val, cls, ph, multi) => {
    if (!EDIT && !has(val)) return '';
    const c = [cls || '', multi ? 'ml' : ''].join(' ').trim();
    return `<${tag}${c ? ` class="${c}"` : ''}${EDIT ? ` data-e="${path}" data-ph="${esc(ph || 'טקסט')}"${multi ? ' data-ml="1"' : ''}` : ''}>${esc(val)}</${tag}>`;
  };
  const I = (path, val, cls, alt) => {
    const s = src(val);
    if (!s && !EDIT) return '';
    return `<span class="iw ${cls || ''}"${EDIT ? ` data-i="${path}"` : ''}>${s ? `<img src="${s}" alt="${esc(alt || '')}" loading="lazy" decoding="async">` : `<span class="iph">${ICON.img}<b>הוספת תמונה</b></span>`}</span>`;
  };
  const B = (path, text, link, cls) => {
    if (!EDIT && !has(text)) return '';
    const h = href(link);
    return `<a class="btn ${cls || ''}" href="${esc(h)}"${ext(h)}>${T('span', path, text, '', 'טקסט כפתור')}${ICON.arrow}</a>`;
  };
  const head = (s, p) => (has(s.kicker) || has(s.title) || has(s.subtitle) || EDIT) ? `<div class="sec-head rv">${T('span', p + '.kicker', s.kicker, 'kicker', 'כותרת קטנה')}${T('h2', p + '.title', s.title, '', 'כותרת')}${T('p', p + '.subtitle', s.subtitle, '', 'תיאור', true)}</div>` : '';
  const waNum = n => { let d = String(n || '').replace(/\D/g, ''); if (d.startsWith('0')) d = '972' + d.slice(1); return d; };
  const waLink = (n, t) => 'https://wa.me/' + waNum(n) + (t ? '?text=' + encodeURIComponent(t) : '');
  const telLink = n => 'tel:' + String(n || '').replace(/[^\d+]/g, '');

  /* ---------- section renderers ---------- */
  const R = {
    hero(s, p) {
      const stats = (s.stats || []).map((x, j) => `<div class="stat">${T('b', `${p}.stats.${j}.num`, x.num, '', 'מספר')}${T('span', `${p}.stats.${j}.label`, x.label, '', 'תיאור')}</div>`).join('');
      const mq = String(s.marquee || '').split('\n').map(x => x.trim()).filter(Boolean);
      const mqh = mq.length ? `<div class="marquee" aria-hidden="true"><div class="mq-track">${[0, 1, 2, 3].map(() => `<div class="mq-g">${mq.map(w => `<span>${esc(w)}</span>`).join('')}</div>`).join('')}</div></div>` : '';
      return `<div class="hero-bg"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>
      <div class="wrap hero-grid">
        <div class="hero-txt">
          ${has(s.badge) || EDIT ? `<div class="badge rv"><i></i>${T('span', p + '.badge', s.badge, '', 'תגית')}</div>` : ''}
          <h1 class="rv">${T('span', p + '.title', s.title, '', 'כותרת ראשית')} ${T('em', p + '.highlight', s.highlight, 'grad-txt', 'מילה מודגשת')}</h1>
          ${T('p', p + '.subtitle', s.subtitle, 'lead rv', 'תיאור', true)}
          <div class="btns rv">${B(p + '.btn1', s.btn1, s.btn1Link, 'pri')}${B(p + '.btn2', s.btn2, s.btn2Link, 'ghost')}</div>
          ${stats ? `<div class="stats rv">${stats}</div>` : ''}
        </div>
        <div class="hero-media rv">
          <span class="ring"></span>
          <div class="frame">${I(p + '.image', s.image, '', s.title)}</div>
          ${has(s.cardTitle) || EDIT ? `<div class="float-card fc1"><span class="fc-ic">${ICON.spark}</span><div>${T('b', p + '.cardTitle', s.cardTitle, '', 'כותרת כרטיס')}${T('small', p + '.cardText', s.cardText, '', 'טקסט')}</div></div>` : ''}
          ${has(s.rating) || EDIT ? `<div class="float-card fc2"><span class="stars">★★★★★</span>${T('small', p + '.rating', s.rating, '', 'דירוג')}</div>` : ''}
        </div>
      </div>${mqh}`;
    },
    about(s, p) {
      const feats = (s.features || []).map((f, j) => `<div class="feat rv"><span class="ic">${esc(f.icon || '✦')}</span><div>${T('b', `${p}.features.${j}.title`, f.title, '', 'כותרת')}${T('small', `${p}.features.${j}.text`, f.text, '', 'טקסט')}</div></div>`).join('');
      const img = I(p + '.image', s.image, '', s.title);
      return `<div class="wrap split${s.imageSide === 'left' ? ' img-left' : ''}">
        ${img ? `<div class="split-media rv">${img}${!s._noBadge && (has(s.badgeNum) || EDIT) ? `<div class="exp">${T('b', p + '.badgeNum', s.badgeNum, '', '10+')}${T('small', p + '.badgeText', s.badgeText, '', 'טקסט')}</div>` : ''}</div>` : ''}
        <div class="split-txt">
          ${T('span', p + '.kicker', s.kicker, 'kicker rv', 'כותרת קטנה')}
          ${T('h2', p + '.title', s.title, 'rv', 'כותרת')}
          ${T('p', p + '.text', s.text, 'rv', 'טקסט', true)}
          ${feats ? `<div class="feats">${feats}</div>` : ''}
          ${B(p + '.btnText', s.btnText, s.btnLink, 'pri rv')}
        </div></div>`;
    },
    text(s, p) { return R.about(Object.assign({}, s, { features: [], _noBadge: true }), p); },
    services(s, p) {
      const cats = s.categories || [];
      const tabs = cats.length > 1 ? `<div class="tabs rv" role="tablist">${cats.map((c, k) => `<button class="tab${k ? '' : ' on'}" data-tab="${k}" role="tab">${esc(c.name)}</button>`).join('')}</div>` : '';
      const panels = cats.map((c, k) => `<div class="svc-panel${k ? '' : ' on'}" data-panel="${k}">${(c.items || []).map((it, j) => {
        const q = `${p}.categories.${k}.items.${j}`;
        const meta = (has(it.duration) || EDIT ? `<span class="chip">${ICON.clock}${T('span', q + '.duration', it.duration, '', 'משך')}</span>` : '') + (has(it.tag) ? `<span class="chip hot">${T('span', q + '.tag', it.tag, '', 'תגית')}</span>` : '');
        return `<article class="svc"><div class="svc-top">${T('h3', q + '.name', it.name, '', 'שם הטיפול')}<span class="dots"></span>${T('span', q + '.price', it.price, 'price', 'מחיר')}</div>${T('p', q + '.desc', it.desc, '', 'תיאור', true)}${meta ? `<div class="svc-meta">${meta}</div>` : ''}</article>`;
      }).join('')}</div>`).join('');
      return `<div class="wrap">${head(s, p)}${tabs}<div class="rv">${panels}</div>${T('p', p + '.note', s.note, 'svc-note', 'הערה')}</div>`;
    },
    gallery(s, p) {
      const cats = (s.categories || []).filter(c => c && has(c.name));
      const f = cats.length ? `<div class="filters rv"><button class="flt on" data-f="*">${esc(s.allLabel || 'הכל')}</button>${cats.map(c => `<button class="flt" data-f="${esc(c.name)}">${esc(c.name)}</button>`).join('')}</div>` : '';
      const items = (s.images || []).map((g, j) => {
        if (!src(g.src) && !EDIT) return '';
        return `<figure class="gi rv" data-c="${esc(g.cat || '')}" data-j="${j}">${I(`${p}.images.${j}.src`, g.src, '', g.caption)}${has(g.caption) || EDIT ? `<figcaption>${T('span', `${p}.images.${j}.caption`, g.caption, '', 'כיתוב')}</figcaption>` : ''}</figure>`;
      }).join('');
      return `<div class="wrap">${head(s, p)}${f}<div class="masonry">${items}</div>${EDIT ? `<div class="add-inline"><button data-act="addimgs" data-i="${p.split('.')[1]}">+ הוספת תמונות לגלריה</button></div>` : ''}</div>`;
    },
    process(s, p) {
      const st = (s.steps || []).map((x, j) => `<div class="step rv"><div class="num">${String(j + 1).padStart(2, '0')}</div>${T('h3', `${p}.steps.${j}.title`, x.title, '', 'שלב')}${T('p', `${p}.steps.${j}.text`, x.text, '', 'תיאור', true)}</div>`).join('');
      return `<div class="wrap">${head(s, p)}<div class="steps">${st}</div></div>`;
    },
    testimonials(s, p) {
      const it = (s.items || []).map((x, j) => {
        const n = Math.max(0, Math.min(5, +x.stars || 5));
        return `<div class="rev rv"><span class="stars">${'★'.repeat(n)}${'☆'.repeat(5 - n)}</span>${T('p', `${p}.items.${j}.text`, x.text, '', 'ביקורת', true)}<div class="who"><span class="av">${esc(String(x.name || '?').trim().charAt(0))}</span><div>${T('b', `${p}.items.${j}.name`, x.name, '', 'שם')}${T('small', `${p}.items.${j}.role`, x.role, '', 'פרט')}</div></div></div>`;
      }).join('');
      return `<div class="wrap">${head(s, p)}<div class="reviews">${it}</div></div>`;
    },
    faq(s, p) {
      const it = (s.items || []).map((x, j) => `<details class="rv"${j === 0 ? ' open' : ''}><summary>${T('span', `${p}.items.${j}.q`, x.q, '', 'שאלה')}</summary>${T('p', `${p}.items.${j}.a`, x.a, '', 'תשובה', true)}</details>`).join('');
      return `<div class="wrap">${head(s, p)}<div class="faq">${it}</div></div>`;
    },
    cta(s, p) {
      return `<div class="wrap"><div class="cta-box rv">${T('h2', p + '.title', s.title, '', 'כותרת')}${T('p', p + '.text', s.text, '', 'טקסט', true)}${B(p + '.btn', s.btn, s.btnLink, '')}</div></div>`;
    },
    contact(s, p) {
      const c = S.contact || {}, f = S.form || {};
      const card = (ic, label, path, val, link) => (has(val) || EDIT) ? `<a class="ic-card rv" href="${esc(href(link))}"${ext(link)}><span class="ic">${ICON[ic]}</span><span><small>${label}</small>${T('b', path, val, '', label)}</span></a>` : '';
      const maps = has(c.address) ? encodeURIComponent(c.address) : '';
      const hours = (c.hours || []).filter(h => has(h.d) || EDIT);
      const opts = [];
      (S.sections || []).forEach(x => { if (x.type === 'services' && x.visible !== false) (x.categories || []).forEach(cat => (cat.items || []).forEach(it => { if (has(it.name)) opts.push(it.name); })); });
      const soc = [['instagram', 'ig', 'אינסטגרם'], ['facebook', 'fb', 'פייסבוק'], ['tiktok', 'tt', 'טיקטוק']].filter(x => has(c[x[0]])).map(x => `<a href="${esc(href(c[x[0]]))}" target="_blank" rel="noopener" aria-label="${x[2]}">${ICON[x[1]]}</a>`).join('');
      return `<div class="wrap">${head(s, p)}<div class="contact-grid">
        <div class="info">
          ${card('phone', 'טלפון', 'contact.phone', c.phone, telLink(c.phone))}
          ${has(c.whatsapp) ? card('wa', 'וואטסאפ', 'contact.whatsapp', c.whatsapp, waLink(c.whatsapp, f.waIntro || '')) : ''}
          ${card('mail', 'אימייל', 'contact.email', c.email, 'mailto:' + (c.email || ''))}
          ${card('pin', 'כתובת', 'contact.address', c.address, maps ? 'https://www.google.com/maps/search/?api=1&query=' + maps : '#')}
          ${hours.length ? `<div class="hours rv"><div class="hours-h"><span class="ic">${ICON.clock}</span><b>${esc(c.hoursTitle || 'שעות פעילות')}</b></div>${hours.map((h, j) => `<div class="hrow">${T('span', `contact.hours.${(c.hours || []).indexOf(h)}.d`, h.d, '', 'ימים')}${T('span', `contact.hours.${(c.hours || []).indexOf(h)}.h`, h.h, '', 'שעות')}</div>`).join('')}</div>` : ''}
          ${s.showNav !== false && maps ? `<div class="navbtns rv"><a class="btn ghost sm" href="https://waze.com/ul?q=${maps}&navigate=yes" target="_blank" rel="noopener">${ICON.waze}ניווט ב-Waze</a><a class="btn ghost sm" href="https://www.google.com/maps/search/?api=1&query=${maps}" target="_blank" rel="noopener">${ICON.map}Google Maps</a></div>` : ''}
          ${s.showSocial !== false && soc ? `<div class="socials rv">${soc}</div>` : ''}
        </div>
        <div class="form-card rv">
          ${T('h3', 'form.title', f.title, '', 'כותרת הטופס')}
          ${T('p', 'form.note', f.note, 'f-note', 'טקסט קצר', true)}
          <form class="lead-form" novalidate>
            <div class="fgrid">
              <div class="fld"><label for="lf-name">שם מלא *</label><input id="lf-name" name="name" autocomplete="name" placeholder="השם שלכם" required></div>
              <div class="fld"><label for="lf-phone">טלפון *</label><input id="lf-phone" name="phone" type="tel" autocomplete="tel" placeholder="050-0000000" required></div>
              ${f.showEmail ? `<div class="fld full"><label for="lf-email">אימייל</label><input id="lf-email" name="email" type="email" autocomplete="email" placeholder="name@example.com" dir="ltr"></div>` : ''}
              ${f.showService !== false && opts.length ? `<div class="fld"><label for="lf-svc">טיפול מבוקש</label><select id="lf-svc" name="service"><option value="">בחירת טיפול</option>${opts.map(o => `<option>${esc(o)}</option>`).join('')}</select></div>` : ''}
              ${f.showDate !== false ? `<div class="fld"><label for="lf-date">תאריך מועדף</label><input id="lf-date" name="date" type="date"></div>` : ''}
              <div class="fld full"><label for="lf-msg">הודעה</label><textarea id="lf-msg" name="msg" placeholder="ספרו לנו מה תרצו..."></textarea></div>
            </div>
            <button class="btn pri full" type="submit">${T('span', 'form.submitText', f.submitText || 'שליחה', '', 'טקסט כפתור')}${ICON.send}</button>
            <div class="form-res" hidden></div>
          </form>
        </div>
      </div></div>`;
    }
  };

  const tools = (i, s) => `<div class="sec-tools">${has(s.nav) ? `<span class="lbl">${esc(s.nav)}</span>` : ''}<button data-act="edit" data-i="${i}" title="עריכה בפאנל">✎</button><button data-act="up" data-i="${i}" title="הזזה למעלה">↑</button><button data-act="down" data-i="${i}" title="הזזה למטה">↓</button><button data-act="dup" data-i="${i}" title="שכפול">⧉</button><button data-act="hide" data-i="${i}" title="הסתרה">👁</button><button data-act="del" data-i="${i}" title="מחיקה">🗑</button></div>`;

  function logoHTML() {
    const b = S.brand || {}, d = S.design || {};
    const im = (has(b.logo) || EDIT) ? I('brand.logo', b.logo, '', b.name) : '';
    const showName = d.showName !== false || !has(b.logo);
    return `<a class="logo" href="#top" aria-label="${esc(b.name)}">${im}${showName ? `<span class="logo-t">${T('span', 'brand.name', b.name, 'ln', 'שם העסק')}${T('small', 'brand.tagline', b.tagline, '', 'תיאור קצר')}</span>` : ''}</a>`;
  }

  function render() {
    const d = S.design || {};
    const rs = document.documentElement.style;
    rs.setProperty('--accent', d.accent || '#d4758f');
    rs.setProperty('--accent2', d.accent2 || '#e9b49b');
    rs.setProperty('--font', `'${d.font || 'Heebo'}'`);
    rs.setProperty('--font-h', `'${d.headingFont || 'Frank Ruhl Libre'}'`);
    rs.setProperty('--hw', FONTS[d.headingFont] === '400' ? '400' : '700');
    rs.setProperty('--r', (d.radius == null ? 22 : d.radius) + 'px');
    rs.setProperty('--logo-h', (d.logoHeight || 46) + 'px');
    const fams = [...new Set([d.font || 'Heebo', d.headingFont || 'Frank Ruhl Libre'])].map(f => 'family=' + f.replace(/ /g, '+') + ':wght@' + (FONTS[f] || '400;700')).join('&');
    const lnk = $('#gf'); const hrefF = 'https://fonts.googleapis.com/css2?' + fams + '&display=swap';
    if (lnk && lnk.getAttribute('href') !== hrefF) lnk.setAttribute('href', hrefF);
    document.title = (S.meta && S.meta.title) || (S.brand && S.brand.name) || '';
    document.documentElement.classList.toggle('no-anim', EDIT || d.animations === false);

    const list = (S.sections || []).map((s, i) => ({ s, i })).filter(o => o.s.visible !== false);
    const navs = list.filter(o => has(o.s.nav)).map(o => `<a href="#${esc(o.s.anchor || o.s.id)}">${esc(o.s.nav)}</a>`).join('');
    const themes = d.allowSwitch !== false ? `<div class="themes" role="group" aria-label="מצב תצוגה">${[['light', 'sun', 'מצב בהיר'], ['dark', 'moon', 'מצב לילה'], ['lux', 'crown', 'מצב יוקרתי']].map(([t, ic, l]) => `<button class="theme-btn" data-t="${t}" title="${l}" aria-label="${l}">${ICON[ic]}</button>`).join('')}</div>` : '';
    const h = S.header || {};
    const c = S.contact || {}, f = S.footer || {};
    const header = `<header class="hdr" id="top"><div class="wrap bar">${logoHTML()}<nav class="nav" id="nav" aria-label="ניווט ראשי"><button class="burger nav-x" aria-label="סגירת תפריט">${ICON.x}</button>${navs}</nav><div class="hdr-end">${themes}${has(h.cta) || EDIT ? `<a class="btn pri sm hdr-cta" href="${esc(href(h.ctaLink))}"${ext(href(h.ctaLink))}>${T('span', 'header.cta', h.cta, '', 'כפתור')}</a>` : ''}<button class="burger nav-open" aria-label="פתיחת תפריט">${ICON.menu}</button></div></div></header>`;
    const main = '<main>' + list.map(({ s, i }) => {
      const fn = R[s.type]; if (!fn) return '';
      return `<section id="${esc(s.anchor || s.id)}" class="sec sec-${s.type} bg-${s.bg || 'default'}" data-si="${i}">${EDIT ? tools(i, s) : ''}${fn(s, 'sections.' + i)}</section>`;
    }).join('') + '</main>';
    const soc = [['instagram', 'ig'], ['facebook', 'fb'], ['tiktok', 'tt']].filter(x => has(c[x[0]])).map(x => `<a href="${esc(href(c[x[0]]))}" target="_blank" rel="noopener" aria-label="${x[0]}">${ICON[x[1]]}</a>`).join('');
    const footer = `<footer class="ftr"><div class="wrap"><div class="ftr-grid">
      <div>${logoHTML()}${T('p', 'footer.text', f.text, 'ftr-txt', 'טקסט תחתון', true)}${soc ? `<div class="socials">${soc}</div>` : ''}</div>
      <div><h4>${esc(f.linksTitle || 'ניווט מהיר')}</h4><div class="ftr-links">${navs}</div></div>
      <div><h4>${esc(f.contactTitle || 'יצירת קשר')}</h4><div class="ftr-links">${has(c.phone) ? `<a href="${telLink(c.phone)}" dir="ltr" style="text-align:right">${esc(c.phone)}</a>` : ''}${has(c.email) ? `<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>` : ''}${has(c.address) ? `<span>${esc(c.address)}</span>` : ''}</div></div>
    </div><div class="copy">${T('span', 'footer.copyright', f.copyright, '', 'זכויות יוצרים')}<a href="#top">חזרה למעלה ↑</a></div></div></footer>`;
    const floats = (d.floatWa !== false && has(c.whatsapp) ? `<a class="wa-float" href="${waLink(c.whatsapp, (S.form || {}).waIntro || '')}" target="_blank" rel="noopener" aria-label="וואטסאפ">${ICON.wa}</a>` : '') + `<button class="totop" aria-label="חזרה למעלה">${ICON.up}</button>`;
    $('#app').innerHTML = header + main + footer + floats;
    after();
  }

  /* ---------- behaviour ---------- */
  let io, nio;
  const activeTabs = {};
  function after() {
    applyTheme(curTheme, true);
    onScroll();
    // restore tabs
    Object.keys(activeTabs).forEach(si => { const sec = $(`[data-si="${si}"]`); if (sec) setTab(sec, activeTabs[si]); });
    if (EDIT) {
      $$('[data-e]').forEach(el => { el.contentEditable = 'true'; el.spellcheck = false; });
    }
    if (io) io.disconnect();
    if (!EDIT && (S.design || {}).animations !== false && 'IntersectionObserver' in window) {
      io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { threshold: .12, rootMargin: '0px 0px -40px 0px' });
      $$('.rv').forEach((el, k) => { el.style.transitionDelay = (k % 4) * 80 + 'ms'; io.observe(el); });
    } else $$('.rv').forEach(el => el.classList.add('in'));
    if (nio) nio.disconnect();
    if ('IntersectionObserver' in window) {
      nio = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { $$('.nav a').forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + e.target.id)); } }), { rootMargin: '-45% 0px -50% 0px' });
      $$('main > section').forEach(s => nio.observe(s));
    }
  }
  function setTab(sec, k) {
    $$('.tab', sec).forEach(b => b.classList.toggle('on', b.dataset.tab == k));
    $$('.svc-panel', sec).forEach(pn => pn.classList.toggle('on', pn.dataset.panel == k));
  }
  let curTheme = (S.design || {}).theme || 'light';
  if (!EDIT && (S.design || {}).allowSwitch !== false) { try { const v = localStorage.getItem('site-theme'); if (v) curTheme = v; } catch (e) {} }
  function applyTheme(t, silent) {
    if (!['light', 'dark', 'lux'].includes(t)) t = 'light';
    curTheme = t;
    document.documentElement.setAttribute('data-theme', t);
    $$('.theme-btn').forEach(b => b.classList.toggle('on', b.dataset.t === t));
    if (!silent && !EDIT) { try { localStorage.setItem('site-theme', t); } catch (e) {} }
    const m = $('meta[name=theme-color]'); if (m) m.setAttribute('content', t === 'light' ? '#fdf8f6' : t === 'dark' ? '#121014' : '#0a0908');
  }
  function onScroll() {
    const y = window.scrollY;
    const h = $('.hdr'); if (h) h.classList.toggle('scrolled', y > 24);
    const t = $('.totop'); if (t) t.classList.toggle('show', y > 700);
  }
  window.addEventListener('scroll', onScroll, { passive: true });

  // lightbox
  let lb, lbList = [], lbI = 0;
  function openLB(fig) {
    if (!lb) {
      lb = document.createElement('div'); lb.className = 'lb';
      lb.innerHTML = `<button class="lb-x" aria-label="סגירה">${ICON.x}</button><button class="lb-p" aria-label="הקודם">${ICON.prev}</button><button class="lb-n" aria-label="הבא">${ICON.next}</button><img alt=""><p></p>`;
      document.body.appendChild(lb);
      lb.addEventListener('click', e => { if (e.target === lb || e.target.closest('.lb-x')) closeLB(); else if (e.target.closest('.lb-n')) stepLB(1); else if (e.target.closest('.lb-p')) stepLB(-1); });
    }
    lbList = $$('.gi:not(.hide)', fig.closest('section')); lbI = lbList.indexOf(fig); showLB(); lb.classList.add('on'); document.body.style.overflow = 'hidden';
  }
  function showLB() { const f = lbList[lbI]; if (!f) return; const im = $('img', f); $('img', lb).src = im ? im.src : ''; $('p', lb).textContent = ($('figcaption', f) || {}).textContent || ''; }
  function stepLB(d) { lbI = (lbI + d + lbList.length) % lbList.length; showLB(); }
  function closeLB() { lb.classList.remove('on'); document.body.style.overflow = ''; }
  document.addEventListener('keydown', e => {
    if (lb && lb.classList.contains('on')) { if (e.key === 'Escape') closeLB(); if (e.key === 'ArrowLeft') stepLB(1); if (e.key === 'ArrowRight') stepLB(-1); }
    if (e.key === 'Escape') closeMenu();
  });
  const closeMenu = () => { const n = $('#nav'); if (n) n.classList.remove('open'); document.body.classList.remove('menu-open'); };

  document.addEventListener('click', e => {
    const t = e.target;
    const tb = t.closest('.theme-btn');
    if (tb) { applyTheme(tb.dataset.t); if (EDIT) post({ type: 'theme', t: tb.dataset.t }); return; }
    if (t.closest('.nav-open')) { $('#nav').classList.add('open'); document.body.classList.add('menu-open'); return; }
    if (t.closest('.nav-x') || (document.body.classList.contains('menu-open') && !t.closest('#nav'))) { closeMenu(); if (!t.closest('a')) return; }
    if (t.closest('.nav a')) closeMenu();
    if (t.closest('.totop')) { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
    const tab = t.closest('.tab');
    if (tab) { const sec = tab.closest('section'); activeTabs[sec.dataset.si] = tab.dataset.tab; setTab(sec, tab.dataset.tab); return; }
    const fl = t.closest('.flt');
    if (fl) {
      const sec = fl.closest('section'); $$('.flt', sec).forEach(b => b.classList.toggle('on', b === fl));
      $$('.gi', sec).forEach(g => { const show = fl.dataset.f === '*' || g.dataset.c === fl.dataset.f; g.classList.toggle('hide', !show); if (show) { g.classList.add('in'); g.animate && g.animate([{ opacity: 0, transform: 'scale(.96)' }, { opacity: 1, transform: 'none' }], { duration: 450, easing: 'cubic-bezier(.2,.8,.2,1)' }); } });
      return;
    }
    if (EDIT) {
      const act = t.closest('[data-act]');
      if (act) { e.preventDefault(); post({ type: 'act', act: act.dataset.act, i: +act.dataset.i }); return; }
      const im = t.closest('[data-i]');
      if (im) { e.preventDefault(); pickImg(im.dataset.i); return; }
      if (t.closest('a') || t.closest('button[type=submit]')) e.preventDefault();
      if (t.closest('summary') && t.closest('[data-e]')) e.preventDefault();
      const sec = t.closest('[data-si]'); if (sec) post({ type: 'focus', i: +sec.dataset.si });
      return;
    }
    const a = t.closest('a[href^="#"]');
    if (a && a.getAttribute('href').length > 1) { const el = document.getElementById(a.getAttribute('href').slice(1)); if (el) { e.preventDefault(); el.scrollIntoView({ behavior: 'smooth' }); } return; }
    const gi = t.closest('.gi'); if (gi) { openLB(gi); return; }
  });

  /* ---------- contact form ---------- */
  document.addEventListener('submit', async e => {
    const form = e.target.closest('.lead-form'); if (!form) return;
    e.preventDefault(); if (EDIT) return;
    const c = S.contact || {}, f = S.form || {};
    const v = Object.fromEntries(new FormData(form).entries());
    let bad = false;
    ['name', 'phone'].forEach(k => { const fld = form.querySelector(`[name=${k}]`).closest('.fld'); const ok = k === 'phone' ? /[\d]{7,}/.test(String(v[k] || '').replace(/\D/g, '')) : has(v[k]); fld.classList.toggle('err', !ok); if (!ok) bad = true; });
    if (bad) { form.querySelector('.fld.err input').focus(); return; }
    const lines = [`שם: ${v.name}`, `טלפון: ${v.phone}`];
    if (has(v.email)) lines.push(`אימייל: ${v.email}`);
    if (has(v.service)) lines.push(`טיפול: ${v.service}`);
    if (has(v.date)) lines.push(`תאריך מועדף: ${v.date.split('-').reverse().join('/')}`);
    if (has(v.msg)) lines.push(`הודעה: ${v.msg}`);
    const body = lines.join('\n');
    const to = f.email || c.email || '';
    const subject = (f.subject || 'פנייה חדשה מהאתר') + ' – ' + v.name;
    const mail = `mailto:${to}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    const wa = has(c.whatsapp) ? waLink(c.whatsapp, (f.waIntro ? f.waIntro + '\n' : '') + body) : '';
    const res = form.querySelector('.form-res'); const btn = form.querySelector('button[type=submit]');
    let sent = false;
    if (f.mode === 'formsubmit' && has(to)) {
      btn.disabled = true; btn.style.opacity = .7;
      try {
        const r = await fetch('https://formsubmit.co/ajax/' + encodeURIComponent(to), { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' }, body: JSON.stringify({ _subject: subject, _template: 'table', _captcha: 'false', 'שם': v.name, 'טלפון': v.phone, 'אימייל': v.email || '', 'טיפול': v.service || '', 'תאריך': v.date || '', 'הודעה': v.msg || '' }) });
        const j = await r.json().catch(() => ({}));
        sent = r.ok && (j.success === true || j.success === 'true');
      } catch (err) { sent = false; }
      btn.disabled = false; btn.style.opacity = '';
    }
    const links = [];
    if (f.mode === 'whatsapp' && wa) links.push(`<a class="btn pri sm" href="${wa}" target="_blank" rel="noopener">${ICON.wa}שליחה בוואטסאפ</a>`);
    if (has(to)) links.push(`<a class="btn ${links.length ? 'ghost' : 'pri'} sm" href="${esc(mail)}">${ICON.mail}שליחה במייל</a>`);
    if (f.mode !== 'whatsapp' && wa) links.push(`<a class="btn ghost sm" href="${wa}" target="_blank" rel="noopener">${ICON.wa}וואטסאפ</a>`);
    res.hidden = false;
    if (sent) {
      res.innerHTML = `<b>${esc(f.successTitle || 'תודה! הפנייה התקבלה')}</b><p>${esc(f.successText || 'נחזור אליכם בהקדם.')}</p>`;
      form.reset();
    } else {
      res.innerHTML = `<b>${esc(f.almostTitle || 'כמעט סיימנו!')}</b><p>${esc(f.almostText || 'הפרטים מוכנים — לחצו לשליחה בערוץ הנוח לכם:')}</p><div class="btns">${links.join('')}</div>`;
      const first = res.querySelector('a');
      if (first) { try { if (first.href.startsWith('mailto:')) { window.location.href = first.href; } else { const w = window.open(first.href, '_blank', 'noopener'); } } catch (err) {} }
    }
  });

  /* ---------- edit mode bridge ---------- */
  let fileIn;
  function pickImg(path) {
    if (!fileIn) { fileIn = document.createElement('input'); fileIn.type = 'file'; fileIn.accept = 'image/*'; fileIn.style.display = 'none'; document.body.appendChild(fileIn); fileIn.addEventListener('change', () => { const fl = fileIn.files[0]; if (fl) post({ type: 'img', path: fileIn.dataset.path, file: fl }); fileIn.value = ''; }); }
    fileIn.dataset.path = path; fileIn.click();
  }
  document.addEventListener('input', e => {
    if (!EDIT) return; const el = e.target.closest && e.target.closest('[data-e]'); if (!el) return;
    const v = el.innerText.replace(/\n+$/, '');
    $$(`[data-e="${el.dataset.e}"]`).forEach(o => { if (o !== el) o.textContent = v; });
    post({ type: 'edit', path: el.dataset.e, value: v });
  });
  document.addEventListener('keydown', e => {
    if (!EDIT) return; const el = e.target.closest && e.target.closest('[data-e]'); if (!el) return;
    if (e.key === 'Enter' && !el.dataset.ml) { e.preventDefault(); el.blur(); }
    if (e.key === ' ' && el.closest('summary,button')) { e.preventDefault(); document.execCommand('insertText', false, ' '); }
  });
  document.addEventListener('paste', e => {
    if (!EDIT) return; const el = e.target.closest && e.target.closest('[data-e]'); if (!el) return;
    e.preventDefault(); const tx = (e.clipboardData || window.clipboardData).getData('text/plain'); document.execCommand('insertText', false, el.dataset.ml ? tx : tx.replace(/\s*\n\s*/g, ' '));
  });
  document.addEventListener('dragover', e => { if (EDIT && e.target.closest && e.target.closest('[data-i]')) e.preventDefault(); });
  document.addEventListener('drop', e => { if (!EDIT) return; const im = e.target.closest && e.target.closest('[data-i]'); if (!im) return; e.preventDefault(); const fl = e.dataTransfer.files[0]; if (fl && fl.type.startsWith('image/')) post({ type: 'img', path: im.dataset.i, file: fl }); });
  window.addEventListener('message', e => {
    const m = e.data || {}; if (!m.__bld) return;
    if (m.type === 'render') { S = m.state; if (m.assets) A = m.assets; if ('edit' in m) EDIT = m.edit; const y = window.scrollY; render(); window.scrollTo(0, y); }
    else if (m.type === 'theme') applyTheme(m.t, true);
    else if (m.type === 'scrollTo') { const el = $(`[data-si="${m.i}"]`); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  });

  render();
  if (EDIT) post({ type: 'ready' });
})();</script>
</body>
</html>
